  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo-brand"><img src="images/logo_result.webp" alt="Logo" width="45" height="45"><span>جبسيات ودهانات الرياض</span></a>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="section-header">
        <h1 class="section-title">الأسئلة الأكثر تكراراً</h1>
      </div>

      <div class="faq-list">
        <div class="faq-item">
          <button class="faq-question"><span>كم تستغرق مدة تنفيذ أسقف الجبس بورد؟</span><svg width="20" height="20" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button>
          <div class="faq-answer"><p>تعتمد المدة على مساحة المشروع، ولكن عادة يستغرق تنفيذ الغرفة أو المجلس من يومين إلى 3 أيام عمل شاملاً المعجون والجاهزية للدهان.</p></div>
        </div>

        <div class="faq-item">
          <button class="faq-question"><span>هل تقدمون ضماناً على الدهانات الخارجية؟</span><svg width="20" height="20" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button>
          <div class="faq-answer"><p>نعم، نوفر ضماناً رسمياً ضد التبشير والتقشر للدهانات الخارجية والبروفايل يدوم حتى 5 سنوات.</p></div>
        </div>
      </div>
    </div>
